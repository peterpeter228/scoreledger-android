name: Signed Android artifact acceptance
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Same-repository build run containing the fixed-signed APK and test APK
        required: true
        type: string
      test_artifact_run_id:
        description: Optional same-repository run for test APK only; blank uses the app artifact run
        required: false
        default: ''
        type: string
      expected_app_sha256:
        description: Optional SHA-256 pin for the exact delivered app APK (64 hexadecimal characters)
        required: false
        default: ''
        type: string
      api:
        description: Disposable AOSP emulator API
        required: true
        type: choice
        options: ['26', '30', '36']
        default: '30'
      allow_kvm:
        description: Approve ACL granting only this ephemeral runner user access to /dev/kvm
        required: true
        default: false
        type: boolean
      run_reinstall_retention:
        description: Seed synthetic data in the fresh emulator and verify retention after same-APK install -r (not a version upgrade)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  signed-artifact-device:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate artifact selection
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          TEST_ARTIFACT_RUN_ID: ${{ inputs.test_artifact_run_id || inputs.artifact_run_id }}
          EXPECTED_APP_SHA256: ${{ inputs.expected_app_sha256 }}
        run: |
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TEST_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ -z "$EXPECTED_APP_SHA256" || "$EXPECTED_APP_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
      - name: Record separate artifact source runs
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          TEST_ARTIFACT_RUN_ID: ${{ inputs.test_artifact_run_id || inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          mkdir -p evidence/signed-device
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" \
            --jq '{id,head_sha,repository:.repository.full_name,html_url,event,path,status,conclusion}' \
            > evidence/signed-device/app-source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TEST_ARTIFACT_RUN_ID" \
            --jq '{id,head_sha,repository:.repository.full_name,html_url,event,path,status,conclusion}' \
            > evidence/signed-device/test-source-run.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Download only from this repository. No signing credentials or build step.
      - uses: actions/download-artifact@v4
        with:
          name: scoreledger-internal-apk
          path: signed-input/app
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: android-test-reports
          path: signed-input/test
          repository: ${{ github.repository }}
          run-id: ${{ inputs.test_artifact_run_id || inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Test exact downloaded fixed-signed APKs
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          TEST_ARTIFACT_RUN_ID: ${{ inputs.test_artifact_run_id || inputs.artifact_run_id }}
          EXPECTED_APP_SHA256: ${{ inputs.expected_app_sha256 }}
          ANDROID_API: ${{ inputs.api }}
          ALLOW_KVM: ${{ inputs.allow_kvm }}
          RUN_REINSTALL_RETENTION: ${{ inputs.run_reinstall_retention }}
        run: bash tools/signed_emulator_acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-device-evidence-api-${{ inputs.api }}
          path: evidence/signed-device/
          if-no-files-found: warn
          retention-days: 14
